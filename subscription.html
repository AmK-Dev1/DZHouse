<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DZHouse – Subscription</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/subscription.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo">DZHouse</div>
            <div class="nav-section">
                <nav>
                    <a href="#">Publich an ad</a>
                    <a href="#">Help</a>
                    <a href="#">Travels</a>
                    <a href="#">Login ▶</a>
                </nav>
                <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="User icon" class="user-icon">
            </div>
        </div>
    </header>

  <main class="subscription-main">
    <div class="container">
      <h1 class="title">Subscription</h1>

      <div class="radio-group">
        <label><input type="radio" name="role" checked> Tenant</label>
        <label><input type="radio" name="role"> Owner</label>
      </div>

      <form>
        <div class="form-row two">
          <input type="text" class="input-text" placeholder="Name">
          <input type="text" class="input-text" placeholder="Family name">
        </div>
        <div class="form-row two">
          <input type="text" class="input-text small" placeholder="+213">
          <input type="text" class="input-text" placeholder="Phone">
        </div>
        <div class="form-row">
          <input type="email" class="input-text" placeholder="Email">
        </div>
        <div class="form-row">
          <input type="password" class="input-text" placeholder="Password">
        </div>

        <div class="button-group">
          <button type="button" class="btn photo">Profile photo</button>
          <button type="button" class="btn photo">ID document photo</button>
        </div>

        <div class="form-row two">
          <input type="text" class="input-text" placeholder="Address">
          <input type="text" class="input-text small" placeholder="Postal code">
        </div>
        <div class="form-row">
          <input type="text" class="input-text" placeholder="RIB">
        </div>

        <button type="submit" class="btn submit">Subscribe</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-column">
      <strong>About HomeAway</strong><br>
      <a href="#">Post a Listing</a><br>
      <a href="#">Trust & Safety</a><br>
      <a href="#">Partner Resources</a><br>
      <a href="#">Travel Guides</a>
    </div>
    <div class="footer-column">
      <strong>Company</strong><br>
      <a href="#">Who are we?</a><br>
      <a href="#">Affiliation / Contact us</a><br>
      <a href="#">Terms of use</a><br>
      <a href="#">Privacy policy</a>
    </div>
    <div class="footer-column">
      <strong>Meet our family</strong><br>
      <a href="#">Vrbo</a><br>
      <a href="#">Abritel.fr</a><br>
      <a href="#">FeWo-direkt.de</a><br>
      <a href="#">Bookabach.co.nz</a>
    </div>
  </footer>

    <!-- JAVA SCRIPT -->
    <script src="./js/subscription.js"></script>
</body>
</html>
